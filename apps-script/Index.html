<!DOCTYPE html>
<html lang="pl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablica spraw</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e2e6ee;
    --brand: #1a73e8; --brand-ink: #fff; --red: #d93025; --red-bg: #fdecea;
    --amber: #b06000; --amber-bg: #fef4e0; --green: #188038; --green-bg: #e6f4ea;
    --blue-bg: #e8f0fe; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 7px 12px; }
  button:hover { border-color: #b8c0cf; }
  button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  button.danger { color: var(--red); }
  button.small { padding: 4px 9px; font-size: 13px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; }

  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; max-width: 1100px; margin: 0 auto; }
  .top h1 { font-size: 17px; margin: 0 auto 0 0; }
  .me { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .me select { width: auto; padding: 5px 8px; }
  .search { flex: 1 1 220px; max-width: 360px; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px; max-width: 1100px; margin: 0 auto; }
  nav button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 12px; white-space: nowrap; color: var(--muted); }
  nav button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  .count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--line); color: var(--ink); font-size: 12px; margin-left: 4px; }
  .count.red { background: var(--red); color: #fff; }

  .banner { margin: 14px 0 0; padding: 12px 14px; border-radius: var(--radius); background: var(--amber-bg); color: #5c3c00; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner b { color: #3d2800; }
  h2 { font-size: 16px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .hint { color: var(--muted); font-size: 13px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); background: var(--card); border-radius: var(--radius); border: 1px dashed var(--line); }

  .list { display: grid; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
  .card.overdue { border-left-color: var(--red); }
  .card.today { border-left-color: var(--amber); }
  .card.later { border-left-color: var(--green); }
  .card.closed { opacity: .75; border-left-color: #9aa0a6; }
  .row1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .patient { font-weight: 650; font-size: 16px; }
  .phone { color: var(--brand); text-decoration: none; font-size: 14px; }
  .due { margin-left: auto; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .due.overdue { color: var(--red); } .due.today { color: var(--amber); } .due.later { color: var(--green); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--blue-bg); color: #174ea6; }
  .chip.stage { background: #f1f3f4; color: var(--ink); }
  .chip.warn { background: var(--red-bg); color: var(--red); }
  .chip.stale { background: #e8eaed; color: #3c4043; }
  .purpose { margin: 4px 0; }
  .last { font-size: 13px; color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .tile .n { font-size: 28px; font-weight: 700; }
  .tile.red .n { color: var(--red); } .tile.green .n { color: var(--green); }
  .tile .l { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); font-size: 14px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f8f9fb; font-weight: 600; font-size: 13px; color: var(--muted); }
  .tablewrap { overflow-x: auto; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(20,25,35,.45); display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; z-index: 20; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 620px; padding: 18px 18px 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 6px; font-size: 18px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .types { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px; }
  .types label { margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px; color: var(--ink); font-size: 14px; cursor: pointer; }
  .types input { width: auto; margin-right: 6px; }
  .types label:has(input:checked) { border-color: var(--brand); background: var(--blue-bg); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .due { margin-left: 0; width: 100%; } }
  .timeline { list-style: none; padding: 0; margin: 8px 0 0; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--line); }
  .timeline li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .timeline .meta { color: var(--muted); font-size: 12px; }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; }
  .stages button.cur { background: var(--blue-bg); border-color: var(--brand); font-weight: 600; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #202124; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30; font-size: 14px; }
  .loading { padding: 60px; text-align: center; color: var(--muted); }
  .clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
  .match { background: var(--blue-bg); color: #174ea6; padding: 7px 10px; border-radius: 8px; font-size: 14px; margin-top: 8px; }
  details { margin-top: 18px; }
  details summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
  .src { font-size: 18px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">🦷 Tablica spraw</h1>
    <input class="search" id="q" type="search" placeholder="🔎 Szukaj: nazwisko, telefon, opis…">
    <div class="me">Na zmianie: <select id="me"></select></div>
    <button class="primary" id="addBtn">＋ Nowa sprawa</button>
  </div>
  <nav id="tabs"></nav>
</header>
<div class="wrap" id="app"><div class="loading">Ładowanie…</div></div>
<div id="modalRoot"></div>

<script>
(function () {
  const H = 36e5;
  const S = { data: null, tab: 'now', q: '', busy: false, modalOpen: false };
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- komunikacja z serwerem ---------- */
  function api(fn, arg) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
    });
  }
  async function call(fn, arg, okMsg) {
    S.busy = true;
    try {
      S.data = await api(fn, arg);
      if (okMsg) toast(okMsg);
      render();
    } catch (e) {
      toast('⚠️ Błąd: ' + (e && e.message ? e.message : e));
    } finally { S.busy = false; }
  }
  async function refresh() {
    if (S.busy || S.modalOpen) return;
    try { S.data = await api('getData'); render(); } catch (e) { /* po cichu, spróbujemy później */ }
  }

  /* ---------- drobiazgi ---------- */
  const cfg = () => S.data.config;
  const me = () => $('#me').value || '';
  const type = t => cfg().types[t.type] || { label: t.type, icon: '•', stages: [{ n: '?' }] };
  const stage = t => type(t).stages[t.stage] || { n: '?' };
  const now = () => Date.now();
  const newId = () => 'T' + now().toString(36) + Math.random().toString(36).slice(2, 6);
  const digits = s => String(s || '').replace(/\D/g, '');
  const pad = n => String(n).padStart(2, '0');
  const days = ['nd', 'pn', 'wt', 'śr', 'czw', 'pt', 'sob'];
  function fmt(ts) {
    const d = new Date(ts), today = new Date();
    const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    const dayDiff = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date(today).setHours(0, 0, 0, 0)) / 864e5);
    if (dayDiff === 0) return 'dziś ' + hm;
    if (dayDiff === 1) return 'jutro ' + hm;
    if (dayDiff === -1) return 'wczoraj ' + hm;
    return days[d.getDay()] + ' ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' + hm;
  }
  function ago(ts) {
    const m = Math.round((now() - ts) / 6e4);
    if (m < 60) return m + ' min';
    const h = Math.round(m / 60);
    return h < 48 ? h + ' godz.' : Math.round(h / 24) + ' dni';
  }
  const endOfToday = () => new Date().setHours(23, 59, 59, 999);
  function urgency(t) {
    if (t.status !== 'open') return 'closed';
    if (!t.dueAt) return 'later';
    if (t.dueAt < now()) return 'overdue';
    if (t.dueAt <= endOfToday()) return 'today';
    return 'later';
  }
  // „Zawieszona” = termin minął i nikt jej nie ruszał dłużej niż staleHours (czekanie na laboratorium przed terminem się nie liczy)
  const isStale = t => t.status === 'open' && (!t.dueAt || t.dueAt < now()) && now() - (t.updatedAt || t.createdAt) > cfg().staleHours * H;
  const lastEntry = t => (t.history || [])[t.history.length - 1];
  const countIn = (t, mark) => (t.history || []).filter(h => h.text.indexOf(mark) === 0).length;
  function toDatetimeLocal(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function tomorrowAt(h) { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(h, 0, 0, 0); return d.getTime(); }
  function inDaysAt(n, h) { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(h, 0, 0, 0); return d.getTime(); }
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(x => x.remove());
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
  }
  function doctorPhone(name) { const d = cfg().doctors.find(x => x.name === name); return d ? d.phone : ''; }
  function waLink(phone, text) { return 'https://wa.me/' + digits(phone) + '?text=' + encodeURIComponent(text); }

  /* ---------- zmiany w sprawie (cała logika tutaj, serwer tylko zapisuje) ---------- */
  function log(t, text) {
    t.history = t.history || [];
    t.history.push({ t: now(), who: me(), text: text });
    t.updatedAt = now(); t.updatedBy = me();
  }
  function applyStage(t, idx, note, due) {
    const st = type(t).stages[idx];
    t.stage = idx;
    log(t, '➡️ Etap: „' + st.n + '”' + (note ? ' — ' + note : ''));
    if (st.done) { t.status = 'done'; t.closedAt = now(); t.dueAt = ''; }
    else { t.status = 'open'; t.closedAt = ''; t.dueAt = due || now() + st.due * H; }
  }
  function nextIdx(t) {
    const st = stage(t);
    return st.next != null ? st.next : Math.min(t.stage + 1, type(t).stages.length - 1);
  }
  const clone = t => JSON.parse(JSON.stringify(t));

  async function moveTo(task, idx) {
    const t = clone(task), st = type(t).stages[idx];
    let note = '';
    if (st.ask) {
      const r = await dialog({ title: st.n, body: '<label>' + esc(st.ask) + '</label><textarea name="note" required autofocus></textarea>', ok: 'Zapisz' });
      if (!r) return; note = r.note.trim();
    }
    applyStage(t, idx, note);
    call('saveTask', t, st.done ? '✅ Sprawa zamknięta' : 'Zapisano');
  }
  async function noAnswer(task) {
    const t = clone(task);
    const stages = type(t).stages, retry = stages.findIndex(s => s.retry);
    const n = countIn(t, '📵') + 1;
    log(t, '📵 Nie odebrał telefonu (próba ' + n + ')');
    if (retry >= 0) { t.stage = retry; t.dueAt = now() + stages[retry].due * H; }
    else t.dueAt = now() + 3 * H;
    call('saveTask', t, 'Zapisano próbę nr ' + n + '. Przypomnę za ' + Math.round((t.dueAt - now()) / H) + ' godz.');
  }
  function remindDoctor(task) {
    const t = clone(task);
    const n = countIn(t, '🔔') + 1;
    const phone = doctorPhone(t.doctor);
    const text = 'Dzień dobry! Przypominam w sprawie pacjenta ' + t.patient + ': ' + t.purpose + '. Etap: ' + stage(t).n +
      '. Proszę o informację, kiedy i na ile czasu umówić pacjenta.';
    if (phone) window.open(waLink(phone, text), '_blank');
    else toast('Brak numeru lekarza w arkuszu „Lekarze” — przypomnij osobiście');
    log(t, '🔔 Przypomnienie dla lekarza' + (t.doctor ? ' ' + t.doctor : '') + ' (' + n + '. raz)');
    t.dueAt = now() + 3 * H;
    call('saveTask', t, 'Przypomnienie nr ' + n + ' zapisane. Kolejne za 3 godz., jeśli lekarz nie odpowie');
  }
  async function addNote(task) {
    const r = await dialog({
      title: 'Komentarz / zmiana terminu',
      body: '<label>Co zrobiono lub co wiadomo</label><textarea name="note" autofocus></textarea>' + duePicker(task.dueAt || now() + 3 * H),
      ok: 'Zapisz'
    });
    if (!r) return;
    const t = clone(task);
    const due = r.due ? new Date(r.due).getTime() : t.dueAt;
    const moved = due !== task.dueAt;
    if (!r.note.trim() && !moved) return;
    log(t, '💬 ' + (r.note.trim() || 'Zmieniono termin') + (moved ? ' (nowy termin: ' + fmt(due) + ')' : ''));
    t.dueAt = due;
    call('saveTask', t, 'Zapisano');
  }
  async function closeTask(task) {
    const r = await dialog({ title: 'Zamknąć bez realizacji?', body: '<label>Powód (pacjent zrezygnował, duplikat, nieaktualne…)</label><textarea name="note" required autofocus></textarea>', ok: 'Zamknij', okCls: 'danger' });
    if (!r) return;
    const t = clone(task);
    log(t, '✖️ Zamknięto: ' + r.note.trim());
    t.status = 'cancelled'; t.closedAt = now(); t.dueAt = '';
    call('saveTask', t, 'Zamknięto');
  }
  function reopen(task) {
    const t = clone(task);
    const idx = type(t).stages.findIndex(s => !s.done);
    t.stage = Math.max(0, idx);
    log(t, '♻️ Przywrócono do pracy');
    t.status = 'open'; t.closedAt = ''; t.dueAt = now() + 2 * H;
    call('saveTask', t, 'Sprawa ponownie otwarta');
  }

  /* ---------- okna dialogowe ---------- */
  function dialog({ title, body, ok = 'OK', okCls = 'primary', cancel = 'Anuluj', wide }) {
    return new Promise(resolve => {
      S.modalOpen = true;
      const root = $('#modalRoot');
      root.innerHTML = '<div class="modal-bg"><form class="modal"' + (wide ? ' style="max-width:760px"' : '') + '><h3>' + esc(title) + '</h3>' + body +
        '<div class="foot">' + (cancel ? '<button type="button" data-x>' + esc(cancel) + '</button>' : '') +
        (ok ? '<button type="submit" class="' + okCls + '">' + esc(ok) + '</button>' : '') + '</div></form></div>';
      const form = root.querySelector('form');
      const close = v => { root.innerHTML = ''; S.modalOpen = false; resolve(v); };
      form.addEventListener('submit', e => {
        e.preventDefault();
        const o = {}; new FormData(form).forEach((v, k) => { o[k] = v; });
        close(o);
      });
      root.querySelectorAll('[data-x]').forEach(b => b.onclick = () => close(null));
      root.querySelector('.modal-bg').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-bg')) close(null); });
      document.addEventListener('keydown', function onEsc(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', onEsc); if (S.modalOpen) close(null); } });
      const af = form.querySelector('[autofocus]'); if (af) setTimeout(() => af.focus(), 30);
      form.__close = close;
    });
  }
  function duePicker(ts) {
    return '<label>Kiedy zrobić / przypomnieć</label><div class="presets">' +
      [['Za 2 godz.', now() + 2 * H], ['Dziś 17:00', new Date().setHours(17, 0, 0, 0)], ['Jutro 10:00', tomorrowAt(10)], ['Za 3 dni', inDaysAt(3, 10)], ['Za tydzień', inDaysAt(7, 10)]]
        .map(p => '<button type="button" class="small" data-due="' + toDatetimeLocal(p[1]) + '">' + p[0] + '</button>').join('') +
      '</div><input type="datetime-local" name="due" value="' + (ts ? toDatetimeLocal(ts) : '') + '">';
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-due]'); if (!b) return;
    const inp = b.closest('form').querySelector('input[name=due]'); inp.value = b.dataset.due;
  });

  async function newTaskDialog(preset, onCreate) {
    preset = preset || {};
    const types = cfg().types;
    const typeKeys = Object.keys(types);
    const body =
      '<div class="quick"><span class="hint">Szybko:</span>' +
      '<button type="button" class="small" data-tpl="extract">🦷 Ekstrakcja / implant dziś → telefon jutro</button>' +
      '<button type="button" class="small" data-tpl="ktsent">📨 Wysłano skierowanie na tomografię</button>' +
      '<button type="button" class="small" data-tpl="lab">🧪 Wysłano do laboratorium</button></div>' +
      '<label>Typ sprawy</label><div class="types">' + typeKeys.map(k =>
        '<label><input type="radio" name="type" value="' + k + '"' + ((preset.type || 'call_after') === k ? ' checked' : '') + '>' + types[k].icon + ' ' + esc(types[k].label) + '</label>').join('') + '</div>' +
      '<div class="grid2"><div><label>Pacjent (imię i nazwisko) *</label><input name="patient" required autofocus value="' + esc(preset.patient || '') + '"></div>' +
      '<div><label>Telefon</label><input name="phone" type="tel" placeholder="+48…" value="' + esc(preset.phone || '') + '"></div>' +
      '<div><label>Jak kontaktuje się pacjent</label><select name="channel">' + CHANNELS.map(c => '<option' + (preset.channel === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
      '<div><label>Lekarz</label><select name="doctor"><option value="">—</option>' + cfg().doctors.map(d => '<option>' + esc(d.name) + '</option>').join('') + '</select></div></div>' +
      '<label>O co chodzi: po co i co trzeba zrobić * <span class="hint">(żeby koleżanka od razu zrozumiała, jeśli pacjent oddzwoni)</span></label>' +
      '<textarea name="purpose" required placeholder="Np.: telefon — jak się czuje po ekstrakcji zęba 36 (wczoraj, dr Nowak)">' + esc(preset.purpose || '') + '</textarea>' +
      '<label>Etap</label><select name="stage"></select>' + duePicker(preset.dueAt || '') +
      '<p class="hint">Jeśli nie podasz terminu — ustawi się automatycznie według etapu.</p>';
    const p = dialog({ title: 'Nowa sprawa', body, ok: 'Utwórz', wide: true });
    const form = $('#modalRoot form');
    const stageSel = form.querySelector('select[name=stage]');
    const fillStages = () => {
      const k = form.querySelector('input[name=type]:checked').value;
      stageSel.innerHTML = types[k].stages.map((s, i) => s.done ? '' : '<option value="' + i + '">' + esc(s.n) + '</option>').join('');
    };
    form.querySelectorAll('input[name=type]').forEach(r => r.onchange = fillStages);
    fillStages();
    const setType = k => { form.querySelector('input[name=type][value=' + k + ']').checked = true; fillStages(); };
    form.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => {
      const tpl = b.dataset.tpl, purpose = form.querySelector('[name=purpose]'), due = form.querySelector('[name=due]');
      if (tpl === 'extract') { setType('call_after'); purpose.value = 'Zadzwonić: jak się czuje po ekstrakcji/implantacji (ząb …, lekarz …)'; due.value = toDatetimeLocal(tomorrowAt(11)); }
      if (tpl === 'ktsent') { setType('kt'); purpose.value = 'Nowy pacjent (reklama). Skierowanie na tomografię wysłane przez WhatsApp. Gdy przyjdzie mail z Diagdent — pokazać lekarzowi i uzyskać odpowiedź, kiedy i na ile czasu umówić'; due.value = toDatetimeLocal(inDaysAt(3, 10)); }
      if (tpl === 'lab') { setType('lab'); purpose.value = 'Korony/licówki: wysłano do laboratorium. Gdy praca wróci — umówić na osadzenie'; due.value = ''; }
    });
    const r = await p;

    const t = {
      id: newId(), createdAt: now(), createdBy: me(), type: r.type, patient: r.patient.trim(), phone: r.phone.trim(),
      channel: r.channel, doctor: r.doctor, purpose: r.purpose.trim(), stage: 0, dueAt: '', status: 'open',
      updatedAt: now(), updatedBy: me(), closedAt: '', source: 'manual', history: []
    };
    log(t, '🆕 Utworzono');
    applyStage(t, Number(r.stage) || 0, '', r.due ? new Date(r.due).getTime() : 0);
    t.history.splice(1, 1); // „Etap” dubluje „Utworzono”
    t.history[0].text = '🆕 Utworzono na etapie „' + stage(t).n + '”';
    if (onCreate) onCreate(t); else call('saveTask', t, 'Sprawa utworzona');
  }

  async function editDialog(task) {

      title: 'Edytuj: ' + task.patient, ok: 'Zapisz',
      body: '<div class="grid2"><div><label>Pacjent</label><input name="patient" required value="' + esc(task.patient) + '"></div>' +
        '<div><label>Telefon</label><input name="phone" value="' + esc(task.phone) + '"></div>' +
        '<div><label>Kanał</label><input name="channel" value="' + esc(task.channel) + '"></div>' +
        '<div><label>Lekarz</label><select name="doctor"><option value="">—</option>' + cfg().doctors.map(d => '<option' + (d.name === task.doctor ? ' selected' : '') + '>' + esc(d.name) + '</option>').join('') + '</select></div></div>' +
        '<label>O co chodzi</label><textarea name="purpose" required>' + esc(task.purpose) + '</textarea>'
    });

  function detailDialog(task) {

      '<li>' + linkify(h.text) + '<div class="meta">' + fmt(h.t) + ' · ' + esc(h.who || '') + '</div></li>').join('');
    const stagesHtml = ty.stages.map((s, i) => '<button type="button" class="small' + (i === t.stage && t.status === 'open' ? ' cur' : '') + '" data-stage="' + i + '">' + (s.done ? '✅ ' : '') + esc(s.n) + '</button>').join('');
    const body =
      '<div class="chips"><span class="chip">' + ty.icon + ' ' + esc(ty.label) + '</span>' +
      (t.doctor ? '<span class="chip">👨‍⚕️ ' + esc(t.doctor) + '</span>' : '') +
      (t.channel ? '<span class="chip">' + esc(t.channel) + '</span>' : '') +

    bindActions(form, () => form.__close(null));
  }
  function linkify(s) {
    return esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a target="_blank" href="$1">mail ↗</a>');
  }

  /* ---------- skrzynka ---------- */
  const CHANNELS = ['Telefon', 'WhatsApp', 'SMS', 'E-mail', 'Booksy', 'ZnanyLekarz', 'Instagram', 'Osobiście'];
  const SRC = {
    booksy: ['📅', 'Booksy', 'Booksy'], znanylekarz: ['🩺', 'ZnanyLekarz', 'ZnanyLekarz'],
    www_form: ['🌐', 'Formularz na stronie', 'Telefon'], www_msg: ['💬', 'Wiadomość ze strony', 'Telefon'],
    email: ['✉️', 'E-mail', 'E-mail'], sms: ['📱', 'SMS', 'SMS'], call: ['📞', 'Nieodebrane połączenie', 'Telefon']
  };
  const src = i => SRC[i.source] || ['•', i.source, 'Telefon'];
  const inbox = () => S.data.inbox || [];
  const newInbox = () => inbox().filter(i => i.status === 'new');
  const isLate = i => i.status === 'new' && now() - i.receivedAt > cfg().inboxAlertMinutes * 6e4;
  const normName = s => String(s || '').toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^a-z0-9]+/).filter(w => w.length >= 3);
  /** Otwarta sprawa tego samego pacjenta: po ostatnich 9 cyfrach telefonu albo po imieniu i nazwisku. */
  function matchTask(i) {
    const open = openTasks(), p9 = digits(i.phone).slice(-9);
    if (p9.length === 9) { const t = open.find(x => digits(x.phone).slice(-9) === p9); if (t) return t; }
    const n = normName(i.name);
    if (n.length < 2) return null;
    return open.find(x => { const pt = normName(x.patient); return pt.length >= 2 && pt.every(w => n.indexOf(w) >= 0); }) || null;
  }
  function inboxCard(i) {
    const sc = src(i), late = isLate(i), m = i.status === 'new' ? matchTask(i) : null;
    const who = i.name || i.email || i.phone || '—';
    const right = i.status === 'new' ? (late ? '⏰ czeka ' : '🕒 ') + ago(i.receivedAt)
      : '✔ ' + esc(i.handledBy || '') + ', ' + fmt(i.handledAt);
    return '<div class="card ' + (i.status !== 'new' ? 'closed' : late ? 'overdue' : 'today') + '">' +
      '<div class="row1"><span class="src">' + sc[0] + '</span><span class="patient">' + esc(who) + '</span>' +
      (i.phone ? '<a class="phone" href="tel:' + esc(i.phone) + '">' + (who === i.phone ? '📞 zadzwoń' : esc(i.phone)) + '</a>' : '') +
      '<span class="due ' + (i.status !== 'new' ? 'later' : late ? 'overdue' : 'today') + '">' + right + '</span></div>' +
      '<div class="chips"><span class="chip' + (i.urgent ? ' warn' : '') + '">' + (i.urgent ? '⚡ ' : '') + esc(i.kind || sc[1]) + '</span>' +
      (i.mailbox ? '<span class="chip stage">📧 ' + esc(i.mailbox) + '</span>' : '') +
      (i.email && i.email !== who ? '<span class="chip stage">' + esc(i.email) + '</span>' : '') +
      '<span class="chip stage">' + fmt(i.receivedAt) + '</span></div>' +
      (i.text ? '<div class="purpose clamp">' + esc(i.text) + '</div>' : '') +
      (m ? '<div class="match">🔗 Ten pacjent ma otwartą sprawę: <b>' + esc(m.patient) + '</b> — ' + esc(type(m).label) + ', ' + esc(stage(m).n) + '. <i>' + esc(m.purpose) + '</i></div>' : '') +
      (i.status !== 'new' && i.note ? '<div class="last">Notatka: ' + esc(i.note) + '</div>' : '') +
      '<div class="actions">' + (i.status === 'new'
        ? (m ? '<button class="small primary" data-iact="attach" data-id="' + i.id + '">🔗 Dodaj do sprawy</button>' : '') +
          '<button class="small' + (m ? '' : ' primary') + '" data-iact="create" data-id="' + i.id + '">➕ Utwórz sprawę</button>' +
          '<button class="small" data-iact="done" data-id="' + i.id + '">✔ Załatwione</button>' +
          (i.source === 'email' && i.email ? '<button class="small" data-iact="ignore" data-id="' + i.id + '">🚫 Ignoruj nadawcę</button>' : '')
        : '<button class="small" data-iact="reopen" data-id="' + i.id + '">↩️ Przywróć</button>') +
        (i.link && i.source !== 'sms' && i.source !== 'call' ? '<a class="small" style="align-self:center;margin-left:6px" target="_blank" href="' + esc(i.link) + '">Otwórz mail ↗</a>' : '') +
      '</div></div>';
  }
  function inboxCards(list, emptyMsg) {
    return list.length ? '<div class="list">' + list.map(inboxCard).join('') + '</div>' : '<div class="empty">' + emptyMsg + '</div>';
  }
  function handled(i, note, taskId) {
    return Object.assign({}, i, { status: 'done', handledBy: me(), handledAt: now(), note: note || '', taskId: taskId || i.taskId || '' });
  }
  function inboxLine(i) {
    return '📥 ' + (i.kind || src(i)[1]) + (i.text ? ' — ' + i.text.slice(0, 200) : '');
  }
  async function inboxAction(act, i) {
    if (!me()) return toast('Najpierw wybierz, kto jest na zmianie');
    if (act === 'done') {
      const r = await dialog({ title: 'Załatwione', ok: 'Zapisz', body: '<label>Co zrobiono? (opcjonalnie)</label><textarea name="note" autofocus placeholder="Np.: potwierdzono w Booksy / oddzwoniono, umówiono na 25.11 10:00"></textarea>' });
      if (!r) return;
      call('saveInbox', { item: handled(i, r.note.trim()) }, '✔ Obsłużone');
    }
    if (act === 'attach') {
      const m = matchTask(i); if (!m) return;
      const t = clone(m);
      log(t, inboxLine(i));
      t.dueAt = Math.min(t.dueAt || 9e15, now() + 30 * 6e4);
      call('saveInbox', { item: handled(i, 'Dodano do sprawy', t.id), task: t }, 'Dodano do sprawy — jest w zakładce „Teraz”');
    }
    if (act === 'create') {
      const cancel = /odwoła/i.test(i.kind || '');
      newTaskDialog({
        type: cancel ? 'revisit' : 'lead', patient: i.name || '', phone: i.phone || '', channel: src(i)[2],
        purpose: (cancel ? 'Odwołał(a) wizytę — zaproponować nowy termin. ' : '') + (i.kind || '') + (i.text ? ': ' + i.text.slice(0, 400) : '') + (i.email ? ' (' + i.email + ')' : '')
      }, t => {
        t.history.push({ t: now() + 1, who: me(), text: inboxLine(i) });
        call('saveInbox', { item: handled(i, 'Utworzono sprawę', t.id), task: t }, 'Sprawa utworzona');
      });
    }
    if (act === 'ignore') {
      const r = await dialog({ title: 'Ignorować nadawcę?', ok: 'Ignoruj', okCls: 'danger', body: '<p>Maile od <b>' + esc(i.email) + '</b> nie będą już trafiać do skrzynki (np. newslettery, faktury). Można to cofnąć w arkuszu „Ustawienia” → inboxIgnore.</p>' });
      if (!r) return;
      call('ignoreSender', { email: i.email, item: handled(i, 'Zignorowano nadawcę') }, 'Nadawca ignorowany');
    }
    if (act === 'reopen') call('saveInbox', { item: Object.assign({}, i, { status: 'new', handledBy: '', handledAt: '', note: '' }) }, 'Przywrócono');
  }
  function viewInbox() {
    const fresh = newInbox().sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0) || a.receivedAt - b.receivedAt);
    const done = inbox().filter(i => i.status !== 'new').sort((a, b) => b.handledAt - a.handledAt);
    return '<h2>Nowe wiadomości <span class="count' + (fresh.some(isLate) ? ' red' : '') + '">' + fresh.length + '</span> <span class="hint">pilne (⚡) i najstarsze na górze · czerwone czekają dłużej niż ' + cfg().inboxAlertMinutes + ' min</span></h2>' +
      inboxCards(fresh, 'Skrzynka pusta 🎉 Wszystkie wiadomości obsłużone.') +
      '<details><summary>Obsłużone w ostatnich 14 dniach (' + done.length + ')</summary>' + inboxCards(done, 'Brak') + '</details>' +
      '<p class="hint" style="margin-top:16px">Instagram i WhatsApp sprawdzaj w Meta Business Suite / na telefonie. Jeśli pacjent czegoś potrzebuje, kliknij „＋ Nowa sprawa” i wybierz kanał Instagram lub WhatsApp.</p>';
  }

  /* ---------- karty ---------- */
  function actionButtons(t, inDetail) {
    if (t.status !== 'open') return '<button type="button" class="small" data-act="reopen" data-id="' + t.id + '">♻️ Przywróć do pracy</button>';
    const ty = type(t), st = stage(t), ni = nextIdx(t), nst = ty.stages[ni];
    let b = '';
    if (ni !== t.stage) b += '<button type="button" class="small primary" data-act="next" data-id="' + t.id + '">' + (nst.done ? '✅ ' : '➡️ ') + esc(nst.n) + '</button>';
    if (ty.stages.some(s => s.retry) && !st.nag) b += '<button type="button" class="small" data-act="noanswer" data-id="' + t.id + '">📵 Nie odebrał</button>';
    if (st.nag || (t.type === 'kt' && t.stage === 1)) b += '<button type="button" class="small" data-act="doctor" data-id="' + t.id + '">🔔 ' + (t.stage === 1 && t.type === 'kt' ? 'Napisz do lekarza' : 'Przypomnij lekarzowi') + '</button>';
    b += '<button type="button" class="small" data-act="note" data-id="' + t.id + '">💬 Komentarz / termin</button>';
    if (inDetail) b += '<button type="button" class="small" data-act="edit" data-id="' + t.id + '">✏️ Dane</button><button type="button" class="small danger" data-act="cancel" data-id="' + t.id + '">✖️ Zamknij bez realizacji</button>';
    return b;
  }
  function bindActions(root, before) {
    root.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const t = S.data.tasks.find(x => x.id === b.dataset.id); if (!t) return;
      if (!me()) { toast('Najpierw wybierz, kto jest na zmianie'); return; }
      if (before) before();
      const a = b.dataset.act;
      if (a === 'next') moveTo(t, nextIdx(t));
      if (a === 'noanswer') noAnswer(t);
      if (a === 'doctor') {
        if (t.type === 'kt' && t.stage === 1) { const c = clone(t); applyStage(c, 2, 'wysłano do lekarza'); remindDoctor(c); }
        else remindDoctor(t);
      }
      if (a === 'note') addNote(t);
      if (a === 'edit') editDialog(t);
      if (a === 'cancel') closeTask(t);
      if (a === 'reopen') reopen(t);
    });
  }
  function card(t) {
    const ty = type(t), st = stage(t), u = urgency(t), le = lastEntry(t);
    const dueTxt = t.status !== 'open' ? (t.status === 'done' ? '✅ zrobione ' : '✖️ zamknięte ') + fmt(t.closedAt)
      : !t.dueAt ? '' : u === 'overdue' ? '⏰ po terminie ' + ago(t.dueAt) : '⏰ ' + fmt(t.dueAt);
    const tries = countIn(t, '📵'), nags = countIn(t, '🔔');
    return '<div class="card ' + u + '" data-open="' + t.id + '">' +
      '<div class="row1"><span class="patient">' + esc(t.patient) + '</span>' +
      (t.phone ? '<a class="phone" href="tel:' + esc(t.phone) + '" onclick="event.stopPropagation()">' + esc(t.phone) + '</a>' : '') +
      '<span class="due ' + u + '">' + dueTxt + '</span></div>' +
      '<div class="chips"><span class="chip">' + ty.icon + ' ' + esc(ty.label) + '</span><span class="chip stage">' + esc(st.n) + '</span>' +
      (t.doctor ? '<span class="chip">👨‍⚕️ ' + esc(t.doctor) + '</span>' : '') +
      (tries ? '<span class="chip warn">📵 prób: ' + tries + '</span>' : '') +
      (nags ? '<span class="chip warn">🔔 przypomniano ' + nags + '×</span>' : '') +
      (isStale(t) ? '<span class="chip stale">🧊 bez ruchu ' + ago(t.updatedAt || t.createdAt) + '</span>' : '') +
      (t.source === 'email' ? '<span class="chip">🤖 z maila</span>' : '') + '</div>' +
      '<div class="purpose">' + esc(t.purpose) + '</div>' +
      (le ? '<div class="last">Ostatnio: ' + esc(le.text.replace(/https?:\/\/\S+/g, '')) + ' — ' + esc(le.who || '') + ', ' + fmt(le.t) + '</div>' : '') +
      '<div class="actions">' + actionButtons(t, false) + '</div></div>';
  }
  function cards(list, emptyMsg) {
    return list.length ? '<div class="list">' + list.map(card).join('') + '</div>' : '<div class="empty">' + emptyMsg + '</div>';
  }
  const byDue = (a, b) => (a.dueAt || 9e15) - (b.dueAt || 9e15);

  /* ---------- zakładki ---------- */
  function openTasks() { return S.data.tasks.filter(t => t.status === 'open'); }
  function pendingShift() {
    const sh = S.data.shifts[S.data.shifts.length - 1];
    return sh && !sh.acceptedBy ? sh : null;
  }

  function viewNow() {
    const open = openTasks();
    const due = open.filter(t => urgency(t) === 'overdue' || urgency(t) === 'today').sort(byDue);
    const staleOnly = open.filter(t => isStale(t) && due.indexOf(t) < 0);
    let h = '<h2>Do zrobienia dziś <span class="hint">zaległe na górze</span></h2>' + cards(due, 'Wszystko zrobione 🎉 Na dziś brak spraw.');
    if (staleOnly.length) h += '<h2>🧊 Długo bez ruchu <span class="hint">po terminie, nikt nie ruszał ponad ' + cfg().staleHours + ' godz.</span></h2>' + cards(staleOnly, '');
    return h;
  }
  function viewAll() {
    const open = openTasks();
    if (!open.length) return '<div class="empty" style="margin-top:20px">Brak otwartych spraw</div>';
    return Object.keys(cfg().types).map(k => {
      const list = open.filter(t => t.type === k).sort((a, b) => a.stage - b.stage || byDue(a, b));
      if (!list.length) return '';
      return '<h2>' + cfg().types[k].icon + ' ' + esc(cfg().types[k].label) + ' <span class="count">' + list.length + '</span></h2>' + cards(list, '');
    }).join('');
  }
  function viewArchive() {
    const list = S.data.tasks.filter(t => t.status !== 'open').sort((a, b) => b.closedAt - a.closedAt);
    return '<h2>Zamknięte w ostatnich 30 dniach</h2>' + cards(list, 'Na razie pusto');
  }
  function viewSearch() {
    const q = S.q.toLowerCase(), qd = digits(q);

      (t.patient || '').toLowerCase().includes(q) || (t.purpose || '').toLowerCase().includes(q) ||

      '<p class="hint">Pacjent oddzwania i pyta „dzwoniliście do mnie?” — otwórz kartę, tam jest cała historia.</p>' +

        return il.length ? '<h2>📥 W skrzynce (14 dni) <span class="count">' + il.length + '</span></h2>' + inboxCards(il, '') : '';
      })();
  }

  function viewShift() {
    const open = openTasks(), pend = pendingShift(), shifts = S.data.shifts.slice().reverse();
    const overdue = open.filter(t => urgency(t) === 'overdue');
    const lastAccepted = S.data.shifts.filter(s => s.acceptedBy === me()).pop();
    const since = Math.max(lastAccepted ? lastAccepted.acceptedAt : 0, new Date().setHours(0, 0, 0, 0));
    const mine = S.data.tasks.filter(t => (t.history || []).some(h => h.who === me() && h.t >= since));
    let h = '';
    if (pend && pend.from !== me()) {
      const theirs = S.data.tasks.filter(t => (t.history || []).some(x => x.who === pend.from && x.t >= new Date(pend.at).setHours(0, 0, 0, 0)));
      h += '<h2>📥 Przejmij zmianę od: ' + esc(pend.from) + '</h2><div class="panel">' +
        '<p>Przekazano ' + fmt(pend.at) + '. Otwartych spraw: <b>' + open.length + '</b>, zaległych: <b style="color:var(--red)">' + overdue.length + '</b>.</p>' +
        (pend.note ? '<p><b>Notatka:</b> ' + esc(pend.note) + '</p>' : '') +
        '<p class="hint">Przejrzyj sprawy, którymi zajmowała się koleżanka, i kliknij „Przejmuję”.</p>' +
        '<button class="primary" id="acceptBtn">✅ Zapoznałam się — przejmuję zmianę</button></div>' +
        '<h2>Sprawy, które prowadziła ' + esc(pend.from) + ' na swojej zmianie <span class="count">' + theirs.length + '</span></h2>' + cards(theirs, 'Brak');
    }
    h += '<h2>📤 Przekaż zmianę</h2><div class="panel">' +
      '<p>Otwartych: <b>' + open.length + '</b> · zaległych: <b style="color:var(--red)">' + overdue.length + '</b> · spraw, które prowadziłaś na tej zmianie: <b>' + mine.length + '</b> · nowych w skrzynce: <b' + (newInbox().length ? ' style="color:var(--red)"' : '') + '>' + newInbox().length + '</b></p>' +
      (newInbox().length ? '<p style="color:var(--red)">📥 W skrzynce są nieobsłużone wiadomości — obsłuż je albo zrób z nich sprawy przed przekazaniem zmiany.</p>' : '') +
      (overdue.length ? '<p style="color:var(--red)">⚠️ Przed przekazaniem dodaj komentarz albo zmień termin w każdej zaległej sprawie, żeby koleżanka wiedziała, co robić.</p>' : '') +
      '<label>Co ważne dla koleżanki (opcjonalnie, reszta jest już w kartach)</label><textarea id="shiftNote" placeholder="Np.: dr Nowak obiecał odpowiedzieć w sprawie tomografii p. Kowalskiej po 16:00"></textarea>' +
      '<div class="actions"><button class="primary" id="handBtn">📤 Przekazuję zmianę</button></div></div>';
    if (overdue.length) h += '<h2>⏰ Zaległe</h2>' + cards(overdue.sort(byDue), '');
    h += '<h2>Dziennik zmian</h2><div class="tablewrap"><table><tr><th>Przekazano</th><th>Kto przekazał</th><th>Notatka</th><th>Otw./zaległe</th><th>Przejęła</th></tr>' +
      (shifts.length ? shifts.map(s => '<tr><td>' + fmt(s.at) + '</td><td>' + esc(s.from) + '</td><td>' + esc(s.note) + '</td><td>' + s.openCount + ' / ' + s.overdueCount +
        '</td><td>' + (s.acceptedBy ? esc(s.acceptedBy) + ', ' + fmt(s.acceptedAt) : '<span style="color:var(--amber)">jeszcze nie przejęto</span>') + '</td></tr>').join('')
        : '<tr><td colspan="5" class="hint">Nie było jeszcze przekazań</td></tr>') + '</table></div>';
    return h;
  }

  function viewStats() {
    const all = S.data.tasks, open = openTasks(), t0 = now();
    const overdue = open.filter(t => urgency(t) === 'overdue'), stale = open.filter(isStale);
    const weekAgo = t0 - 7 * 864e5;
    const closed = all.filter(t => t.status !== 'open');
    const closedWeek = closed.filter(t => t.closedAt > weekAgo);
    const avgDays = list => { const d = list.filter(t => t.status === 'done'); return d.length ? (d.reduce((s, t) => s + (t.closedAt - t.createdAt), 0) / d.length / 864e5).toFixed(1) : '—'; };
    const tile = (n, l, cls) => '<div class="tile ' + (cls || '') + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
    let h = '<h2>Ogólny obraz</h2><div class="tiles">' +
      tile(open.length, 'otwartych spraw') + tile(overdue.length, 'zaległych', overdue.length ? 'red' : 'green') +
      tile(stale.length, 'bez ruchu > ' + cfg().staleHours + ' godz.', stale.length ? 'red' : 'green') +
      tile(closedWeek.length, 'zamknięto w 7 dni', 'green') + tile(avgDays(closed), 'dni średnio do realizacji') + '</div>';
    const wk = inbox().filter(i => i.receivedAt > weekAgo);
    const react = list => { const d = list.filter(i => i.status !== 'new' && i.handledAt); return d.length ? Math.round(d.reduce((s, i) => s + (i.handledAt - i.receivedAt), 0) / d.length / 6e4) + ' min' : '—'; };
    h += '<h2>📥 Skrzynka (7 dni)</h2><div class="tiles">' + tile(wk.length, 'wiadomości') +
      tile(newInbox().length, 'czeka na obsługę', newInbox().some(isLate) ? 'red' : 'green') + tile(react(wk), 'średni czas reakcji') + '</div>' +
      '<div class="tablewrap" style="margin-top:10px"><table><tr><th>Źródło</th><th>Wiadomości</th><th>Obsłużone</th><th>Zrobiono sprawę</th><th>Śr. reakcja</th></tr>' +
      Object.keys(SRC).map(k => { const l = wk.filter(i => i.source === k); return l.length ? '<tr><td>' + SRC[k][0] + ' ' + SRC[k][1] + '</td><td>' + l.length + '</td><td>' + l.filter(i => i.status !== 'new').length + '</td><td>' + l.filter(i => i.taskId).length + '</td><td>' + react(l) + '</td></tr>' : ''; }).join('') +
      '</table></div>';
    h += '<h2>Według typów</h2><div class="tablewrap"><table><tr><th>Typ</th><th>Otwarte</th><th>Zaległe</th><th>Zrobione (30 dni)</th><th>Zamknięte bez realizacji</th><th>Śr. dni</th></tr>' +
      Object.keys(cfg().types).map(k => {
        const a = all.filter(t => t.type === k);
        return '<tr><td>' + cfg().types[k].icon + ' ' + esc(cfg().types[k].label) + '</td><td>' + a.filter(t => t.status === 'open').length + '</td><td>' +
          a.filter(t => urgency(t) === 'overdue').length + '</td><td>' + a.filter(t => t.status === 'done').length + '</td><td>' +
          a.filter(t => t.status === 'cancelled').length + '</td><td>' + avgDays(a) + '</td></tr>';
      }).join('') + '</table></div>';
    const people = {};
    all.forEach(t => (t.history || []).forEach(x => {
      if (x.t < weekAgo || !x.who) return;
      const p = people[x.who] = people[x.who] || { actions: 0, created: 0, closed: 0, calls: 0, nags: 0 };
      p.actions++;
      if (x.text.indexOf('🆕') === 0) p.created++;
      if (x.text.indexOf('📵') === 0) p.calls++;
      if (x.text.indexOf('🔔') === 0) p.nags++;
    }));
    closedWeek.forEach(t => { if (people[t.updatedBy]) people[t.updatedBy].closed++; });
    h += '<h2>Kto co robił w ostatnich 7 dniach</h2><div class="tablewrap"><table><tr><th>Kto</th><th>Działań</th><th>Utworzono</th><th>Zamknięto</th><th>Nieodebranych telefonów</th><th>Przypomnień lekarzom</th></tr>' +
      (Object.keys(people).length ? Object.keys(people).map(n => { const p = people[n]; return '<tr><td>' + esc(n) + '</td><td>' + p.actions + '</td><td>' + p.created + '</td><td>' + p.closed + '</td><td>' + p.calls + '</td><td>' + p.nags + '</td></tr>'; }).join('')
        : '<tr><td colspan="6" class="hint">Brak danych</td></tr>') + '</table></div>';
    const docs = {};
    open.filter(t => type(t).stages[t.stage].nag && t.doctor).forEach(t => { (docs[t.doctor] = docs[t.doctor] || []).push(t); });
    h += '<h2>👨‍⚕️ Czekamy na odpowiedź lekarzy</h2>' + (Object.keys(docs).length
      ? '<div class="tablewrap"><table><tr><th>Lekarz</th><th>Pacjenci</th><th>Najdłużej czekamy</th></tr>' + Object.keys(docs).map(d =>
        '<tr><td>' + esc(d) + '</td><td>' + docs[d].map(t => esc(t.patient)).join(', ') + '</td><td>' + ago(Math.min.apply(null, docs[d].map(t => t.updatedAt))) + '</td></tr>').join('') + '</table></div>'
      : '<div class="empty">Żaden lekarz nie zalega z odpowiedzią 👍</div>');
    if (stale.length) h += '<h2>🧊 Zawieszone</h2>' + cards(stale.sort((a, b) => a.updatedAt - b.updatedAt), '');
    return h;
  }

  /* ---------- renderowanie ---------- */
  function render() {
    if (!S.data) return;
    const c = cfg();
    document.title = c.clinicName + ' — tablica spraw';
    $('#title').textContent = '🦷 ' + c.clinicName;
    const sel = $('#me'), saved = store.get('me');
    if (sel.options.length !== c.admins.length + 1) {
      sel.innerHTML = '<option value="">— wybierz —</option>' + c.admins.map(a => '<option>' + esc(a) + '</option>').join('');
      if (saved && c.admins.indexOf(saved) >= 0) sel.value = saved;
    }
    const open = openTasks();
    const nowCount = open.filter(t => ['overdue', 'today'].indexOf(urgency(t)) >= 0).length;
    const overdueCount = open.filter(t => urgency(t) === 'overdue').length;
    const pend = pendingShift();
    const tabs = [
      ['now', '⏰ Teraz', nowCount, overdueCount > 0],
      ['inbox', '📥 Skrzynka', newInbox().length, newInbox().some(isLate)],
      ['all', '📋 Wszystkie otwarte', open.length],
      ['shift', '🔄 Przekazanie zmiany', pend && pend.from !== me() ? '!' : '', pend && pend.from !== me()],
      ['stats', '📊 Statystyki'],
      ['archive', '🗄 Archiwum']
    ];
    $('#tabs').innerHTML = tabs.map(t => '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] && !S.q ? 'on' : '') + '">' + t[1] +
      (t[2] !== undefined && t[2] !== '' ? '<span class="count' + (t[3] ? ' red' : '') + '">' + t[2] + '</span>' : '') + '</button>').join('');

    let h = '';
    if (!me()) h += '<div class="banner">👋 Wybierz u góry, kto jest teraz na zmianie: wszystkie działania zapisują się pod tym imieniem.</div>';
    if (pend && me() && pend.from !== me() && S.tab !== 'shift')
      h += '<div class="banner">🔄 <span><b>' + esc(pend.from) + '</b> przekazała zmianę ' + fmt(pend.at) + (pend.note ? ': „' + esc(pend.note) + '”' : '') +
        '. Zmiana jeszcze nie przejęta.</span><button class="small primary" data-goto="shift">Przejrzyj i przejmij</button></div>';
    if (newInbox().length && S.tab === 'now' && !S.q)
      h += '<div class="banner">📥 <span>W skrzynce czeka <b>' + newInbox().length + '</b> nowych wiadomości' + (newInbox().some(isLate) ? ', w tym <b>' + newInbox().filter(isLate).length + '</b> dłużej niż ' + c.inboxAlertMinutes + ' min' : '') + '.</span><button class="small primary" data-goto="inbox">Otwórz skrzynkę</button></div>';
    if (!c.ktAutomation && S.tab === 'now')
      h += '<p class="hint" style="margin-top:12px">🤖 Automatyczne tworzenie spraw z maili o tomografii jest wyłączone: uzupełnij „ktEmailQuery” w arkuszu „Ustawienia”.</p>';
    h += S.q ? viewSearch() : ({ now: viewNow, inbox: viewInbox, all: viewAll, shift: viewShift, stats: viewStats, archive: viewArchive })[S.tab]();
    $('#app').innerHTML = h;

    bindActions($('#app'));
    $('#app').querySelectorAll('[data-iact]').forEach(b => b.onclick = () => {
      const i = inbox().find(x => x.id === b.dataset.id); if (i) inboxAction(b.dataset.iact, i);
    });
    $('#app').querySelectorAll('[data-open]').forEach(el => el.onclick = e => {
      if (e.target.closest('a,button')) return;
      const t = S.data.tasks.find(x => x.id === el.dataset.open); if (t) detailDialog(t);
    });
    $('#app').querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { S.tab = b.dataset.goto; render(); });
    const acc = $('#acceptBtn');
    if (acc) acc.onclick = () => {
      if (!me()) return toast('Wybierz, kto jest na zmianie');
      const p = Object.assign({}, pendingShift(), { acceptedBy: me(), acceptedAt: now() });
      call('saveShift', p, 'Zmiana przejęta. Miłej pracy!');
    };
    const hand = $('#handBtn');
    if (hand) hand.onclick = () => {
      if (!me()) return toast('Wybierz, kto jest na zmianie');
      const o = openTasks();
      call('saveShift', {
        id: 'S' + now().toString(36), at: now(), from: me(), note: $('#shiftNote').value.trim(),
        openCount: o.length, overdueCount: o.filter(t => urgency(t) === 'overdue').length, acceptedBy: '', acceptedAt: ''
      }, 'Zmiana przekazana. Koleżanka zobaczy powiadomienie.');
    };
  }

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    S.tab = b.dataset.tab; S.q = ''; $('#q').value = ''; render();
  });
  $('#q').addEventListener('input', e => { S.q = e.target.value.trim(); render(); });
  $('#me').addEventListener('change', e => { store.set('me', e.target.value); render(); });
  $('#addBtn').onclick = () => { if (!S.data) return; if (!me()) return toast('Najpierw wybierz, kto jest na zmianie'); newTaskDialog(); };

  api('getData').then(d => { S.data = d; render(); }).catch(e => { $('#app').innerHTML = '<div class="empty">Nie udało się załadować: ' + esc(e && e.message || e) + '</div>'; });
  setInterval(refresh, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
